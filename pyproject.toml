[project]
name = "songscribe"
description = "Style prompts from a 73-preset library, plus caption, lyrics and duration extracted from audio. Targets MiniMax Music 3 and YuE2 prompt formats. Runs on CPU."
version = "0.12.0"
license = "MIT"
requires-python = ">=3.10"

# Surfaced by Comfy Registry search and by package indexes.
keywords = [
    "comfyui", "comfyui-nodes", "custom-nodes",
    "music", "music-generation", "ai-music", "text-to-music",
    "minimax-music", "yue2", "song", "lyrics",
    "prompt", "style-prompt", "prompt-generator",
    "audio-analysis", "bpm-detection", "key-detection",
]

# Pure Python; the analysis runs on CPU, so it is not GPU- or OS-specific.
classifiers = [
    "Operating System :: OS Independent",
]

# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]
dependencies = ["librosa>=0.10", "mutagen>=1.45", "PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/TheLocalLab/ComfyUI-SongScribe"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/TheLocalLab/ComfyUI-SongScribe#readme"
"Bug Tracker" = "https://github.com/TheLocalLab/ComfyUI-SongScribe/issues"

[tool.comfy]
PublisherId = "the-local-lab"
DisplayName = "ComfyUI-SongScribe"
Icon = "https://raw.githubusercontent.com/TheLocalLab/ComfyUI-SongScribe/main/icon.png"
includes = []
# "requires-comfyui" = ">=1.0.0"  # ComfyUI version compatibility
