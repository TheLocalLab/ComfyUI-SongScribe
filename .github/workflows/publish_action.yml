name: Publish to Comfy Registry

# Fires when pyproject.toml lands on main - which is where `version` lives, so
# a version bump is what publishes. Editing anything else (presets, README,
# node code) will NOT publish; bump the version to ship those changes.
#
# workflow_dispatch also allows a manual run from the Actions tab, which is the
# easiest way to retry a failed publish without making a dummy commit.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          # Repository secret, not an environment or account secret.
          # Settings -> Secrets and variables -> Actions -> New repository secret
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
